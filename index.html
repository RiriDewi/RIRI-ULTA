<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff91b8">
    <meta name="description" content="Kejutan ulang tahun ke-26 untuk Riri Dewi">
    <title>Happy 26th Birthday, Riri Dewi 💗</title><link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Coiny&family=Dancing+Script:wght@700&family=Sriracha&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head><body><!-- HALAMAN PEMBUKA --><div id="intro">
    <div class="intro-card">
        <div class="intro-heart">💗</div>    <p class="intro-small">A SPECIAL DAY FOR</p>

    <h1>Riri Dewi</h1>

    <div class="intro-divider">♡ ───── ♡</div>

    <p class="intro-message">
        Someone special deserves<br>
        something beautiful.
    </p>

    <div class="birthday-age">26th Birthday 🎂</div>

    <div id="countdown">23:59:57</div>

    <p id="countdown-text">
        Your special moment is coming...
    </p>

    <button id="start-button" disabled>
        🎁 KLIK RIRI DEWI
    </button>

    <p class="intro-footer">Made with love ♡</p>
</div>

</div><!-- MUSIK --><audio id="birthday-music" loop preload="auto">
    <source src="lagu.mp3" type="audio/mpeg">
</audio><!-- WEBSITE ULANG TAHUN --><div id="wrapper"><div class="flag__birthday">
    <img src="./images/1.png" alt="Dekorasi bendera" class="flag__left">
    <img src="./images/1.png" alt="Dekorasi bendera" class="flag__right">
</div>

<div class="content">

    <div class="left">

        <div class="title">
            <h1 class="happy">
                <span style="--t: .2s">H</span>
                <span style="--t: .4s">a</span>
                <span style="--t: .6s">p</span>
                <span style="--t: .8s">p</span>
                <span style="--t: 1s">y</span>
            </h1>

            <h1 class="birthday">
                <span style="--t: 1.2s">B</span>
                <span style="--t: 1.4s">i</span>
                <span style="--t: 1.6s">r</span>
                <span style="--t: 1.8s">t</span>
                <span style="--t: 2s">h</span>
                <span style="--t: 2.2s">d</span>
                <span style="--t: 2.4s">a</span>
                <span style="--t: 2.6s">y</span>
            </h1>

            <div class="hat">
                <img src="./images/hat.png" alt="Topi ulang tahun">
            </div>
        </div>

        <div class="date__of__birth">
            <span></span>
        </div>

        <div class="btn">
            <button id="btn__letter">
                Buka Surat 💌
                <i class="fa-regular fa-envelope"></i>
            </button>
        </div>

    </div>

    <div class="right">

        <div class="box__account">

            <div class="image">
                <img src="./images/img.png" alt="Foto ulang tahun">
            </div>

            <div class="name">
                <i class="fa-solid fa-heart"></i>
                <span>Riri Dewi</span>
                <i class="fa-solid fa-heart"></i>
            </div>

            <div class="balloon_one">
                <img src="./images/balloon1.png" alt="Balon" width="100">
            </div>

            <div class="balloon_two">
                <img src="./images/balloon2.png" alt="Balon" width="100">
            </div>

        </div>

        <div class="cricle">
            <div class="text__cricle">
                <span style="--i:1">H</span>
                <span style="--i:2">A</span>
                <span style="--i:3">P</span>
                <span style="--i:4">P</span>
                <span style="--i:5">Y</span>
                <span style="--i:6">-</span>
                <span style="--i:7">B</span>
                <span style="--i:8">I</span>
                <span style="--i:9">R</span>
                <span style="--i:10">T</span>
                <span style="--i:11">H</span>
                <span style="--i:12">D</span>
                <span style="--i:13">A</span>
                <span style="--i:14">Y</span>
                <span style="--i:15">-</span>
            </div>
            <i class="fa-solid fa-heart"></i>
        </div>

    </div>
</div>

<!-- DEKORASI -->
<div class="decorate_star star1"></div>
<div class="decorate_star star2"></div>
<div class="decorate_star star3"></div>
<div class="decorate_star star4"></div>
<div class="decorate_star star5"></div>

<div class="decorate_flower--one">
    <img src="./images/decorate_flower.png" alt="">
</div>

<div class="decorate_flower--two">
    <img src="./images/decorate_flower.png" alt="">
</div>

<div class="decorate_flower--three">
    <img src="./images/decorate_flower.png" alt="">
</div>

<div class="decorate_bottom">
    <img src="./images/decorate.png" alt="Dekorasi">
</div>

<div class="smiley__icon">
    <img src="./images/smiley_icon.png" alt="Smiley">
</div>

<!-- SURAT UCAPAN -->
<div class="box__letter">
    <div class="letter__border">

        <div class="letter">

            <div class="title__letter"></div>

            <div class="content__letter">

                <div class="left">
                    <img
                        id="heart__letter"
                        src="https://media0.giphy.com/media/c76IJLufpNwSULPk77/giphy.gif"
                        alt="Animasi hati">

                    <img class="heart heart_1" src="./images/heart.png" alt="">
                    <img class="heart heart_2" src="./images/heart.png" alt="">
                    <img class="heart heart_3" src="./images/heart.png" alt="">
                    <img class="heart heart_4" src="./images/heart.png" alt="">
                </div>

                <div class="right">

                    <div class="love__img">
                        <img
                            src="https://media4.giphy.com/media/W4jyjmIpnw6e38B6Qc/giphy.gif"
                            alt="Animasi lucu">
                    </div>

                    <div class="text__letter">
                        <p></p>
                    </div>

                    <img id="mewmew" src="./images/mewmew.gif" alt="Kucing lucu">

                </div>
            </div>
        </div>

        <button class="close" aria-label="Tutup surat">
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>
</div>

</div><script>
document.addEventListener("DOMContentLoaded", function () {

    const intro = document.getElementById("intro");
    const countdown = document.getElementById("countdown");
    const countdownText = document.getElementById("countdown-text");
    const startButton = document.getElementById("start-button");
    const music = document.getElementById("birthday-music");

    let remaining = 3;
    let opened = false;

    function updateCountdown() {
        const display = [
            Math.floor(remaining / 3600),
            Math.floor((remaining % 3600) / 60),
            remaining % 60
        ].map(n => String(n).padStart(2, "0")).join(":");

        countdown.textContent = display;
    }

    // Timer awal 23:59:57 menuju 00:00:00
    countdown.textContent = "23:59:57";

    const timer = setInterval(function () {
        remaining--;

        if (remaining === 2) {
            countdown.textContent = "23:59:58";
        } else if (remaining === 1) {
            countdown.textContent = "23:59:59";
        } else {
            countdown.textContent = "00:00:00";
            clearInterval(timer);

            countdownText.textContent =
                "Selamat ulang tahun, Riri Dewi! 💗";

            startButton.disabled = false;
        }
    }, 1000);

    // Buka kejutan
    startButton.addEventListener("click", async function () {
        if (opened || startButton.disabled) return;
        opened = true;

        startButton.textContent = "💗 Membuka kejutan...";
        startButton.disabled = true;

        try {
            await music.play();
        } catch (error) {
            countdownText.textContent =
                "Kejutan siap! Jika musik belum berbunyi, periksa file lagu.mp3.";
        }

        intro.classList.add("hide");

        setTimeout(function () {
            intro.style.display = "none";
            document.body.classList.add("birthday-started");
        }, 850);
    });

    // Tanggal ulang tahun
    const dateElement = document.querySelector(".date__of__birth span");
    const dateText = "16 Oktober 2026";

    let dateIndex = 0;

    const dateTimer = setInterval(function () {
        if (dateIndex < dateText.length) {
            dateElement.textContent += dateText[dateIndex];
            dateIndex++;
        } else {
            clearInterval(dateTimer);
        }
    }, 100);

    // Isi surat
    const message =
        "Mabruk Alfa Mabruk, Barakallah fii umrik, teman baikku. " +
        "Selamat bertambah usia, makin sabar dan kuat, serta doa terbaik untukmu. " +
        "Semoga di umur yang sekarang semesta lebih berpihak, ya. " +
        "Semoga bisa mendapatkan hal-hal yang selama ini diperjuangkan! " +
        "Dan semoga itu selamanya. " +
        "Best wishes for special people. <3 " +
        "Selamat ulang tahun ke-26, Riri Dewi! 💗";

    const letterTitle = "Untuk Riri Dewi 💗";

    const letterBox = document.querySelector(".box__letter");
    const letterBorder = document.querySelector(".letter__border");
    const titleElement = document.querySelector(".title__letter");
    const messageElement = document.querySelector(".text__letter p");

    const letterButton = document.getElementById("btn__letter");
    const closeButton = document.querySelector(".close");

    let typingTimers = [];

    function clearTyping() {
        typingTimers.forEach(clearInterval);
        typingTimers = [];
    }

    function openLetter() {
        clearTyping();

        titleElement.textContent = "";
        messageElement.textContent = "";

        document.querySelectorAll(".heart").forEach(el => {
            el.classList.remove("animation");
        });

        $("#heart__letter, .love__img, #mewmew").removeClass("animationOp");

        letterBox.style.display = "block";
        letterBorder.style.display = "block";

        let titleIndex = 0;
        const titleTimer = setInterval(function () {
            if (titleIndex < letterTitle.length) {
                titleElement.textContent += letterTitle[titleIndex];
                titleIndex++;
            } else {
                clearInterval(titleTimer);
            }
        }, 75);

        typingTimers.push(titleTimer);

        setTimeout(() => {
            $("#heart__letter, .love__img, #mewmew").addClass("animationOp");
        }, 500);

        setTimeout(() => {
            document.querySelectorAll(".heart").forEach(el => {
                el.classList.add("animation");
            });
        }, 800);

        setTimeout(() => {
            let index = 0;

            const messageTimer = setInterval(function () {
                if (index < message.length) {
                    messageElement.textContent += message[index];
                    index++;
                } else {
                    clearInterval(messageTimer);
                }
            }, 35);

            typingTimers.push(messageTimer);
        }, 700);
    }

    letterButton.addEventListener("click", openLetter);

    closeButton.addEventListener("click", function () {
        clearTyping();

        letterBox.style.display = "none";
        letterBorder.style.display = "none";

        titleElement.textContent = "";
        messageElement.textContent = "";

        $("#heart__letter, .love__img, #mewmew").removeClass("animationOp");

        document.querySelectorAll(".heart").forEach(el => {
            el.classList.remove("animation");
        });
    });

});
</script></body>
</html>
